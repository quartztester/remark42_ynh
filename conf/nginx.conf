# Server-sent events stream: no buffering, long-lived connections
location __PATH__/api/v1/stream {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    chunked_transfer_encoding on;
}

# Upstream ships no root page: land visitors on the demo/console page which
# hosts the widget (login + admin UI live there). Path is locked to "/" by
# the install script, hence the literal /.
location = / {
    return 302 /web/;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Comment attachments (images)
    client_max_body_size 20M;
}
