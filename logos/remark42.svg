<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a33"/>
      <stop offset="1" stop-color="#27414d"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67cbe4"/>
      <stop offset="1" stop-color="#4fbbd6"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="url(#bg)"/>

  <!-- second bubble, peeking behind top-right -->
  <g transform="translate(150 42)">
    <path d="M120 40 h120 a46 46 0 0 1 46 46 v70 a46 46 0 0 1 -46 46 h-8 v-52 a44 44 0 0 0 -44 -44 h-132 v-20 a46 46 0 0 1 46 -46 z"
          fill="#3a6577"/>
  </g>

  <!-- main bubble -->
  <path d="M132 150 h248 a56 56 0 0 1 56 56 v116 a56 56 0 0 1 -56 56 h-148 l-76 62 v-62 h-24 a56 56 0 0 1 -56 -56 v-116 a56 56 0 0 1 56 -56 z"
        fill="url(#bubble)"/>

  <!-- 42 as vector paths (no font dependency) -->
  <g fill="#12242c">
    <!-- digit 4 -->
    <path d="M175 236 l-64 92 h64 v26 h26 v-26 h20 v-24 h-20 v-68 z
             M175 256 v48 h-32 z" fill-rule="evenodd"/>
    <!-- digit 2 -->
    <path d="M266 288 c0 -34 22 -58 56 -58 c30 0 50 20 50 46 c0 18 -9 31 -28 48 l-44 40 h74 v26 h-110 v-20 l52 -48 c14 -13 20 -22 20 -34 c0 -14 -10 -24 -25 -24 c-18 0 -30 14 -31 34 z"/>
  </g>
</svg>
